<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>fill-ds160</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --card: #fff;
      --ink: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --amber: #d97706;
      --amber-bg: #fffbeb;
      --green: #047857;
      --red: #b91c1c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    header {
      padding: 14px 16px 10px;
      background: #111827;
      color: #fff;
    }
    header h1 {
      margin: 0;
      font-size: 16px;
      letter-spacing: 0.04em;
    }
    header p {
      margin: 4px 0 0;
      color: #d1d5db;
      font-size: 12px;
    }
    main { padding: 12px 16px 16px; }
    .drop {
      border: 1.5px dashed #c4c4c4;
      border-radius: 10px;
      padding: 18px 12px;
      text-align: center;
      background: var(--card);
      color: var(--muted);
    }
    .drop.over { border-color: var(--amber); background: var(--amber-bg); color: var(--ink); }
    .row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    button {
      border: 0;
      border-radius: 8px;
      padding: 8px 12px;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.45; cursor: default; }
    .primary { background: var(--amber); color: #fff; }
    .ghost { background: #fff; border: 1px solid var(--line); color: var(--ink); }
    .danger { background: #fff; border: 1px solid #fecaca; color: var(--red); }
    ul { list-style: none; margin: 12px 0 0; padding: 0; }
    li {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 8px;
      align-items: center;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 6px;
    }
    .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .status { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
    .queued { color: var(--muted); }
    .filling { color: var(--amber); }
    .done { color: var(--green); }
    .failed, .stopped { color: var(--red); }
    .x {
      background: transparent;
      border: 0;
      color: var(--muted);
      padding: 0 4px;
      font-size: 16px;
    }
    pre {
      margin: 12px 0 0;
      height: 220px;
      overflow: auto;
      background: #111827;
      color: #e5e7eb;
      border-radius: 8px;
      padding: 10px;
      font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <header>
    <h1>fill-ds160</h1>
    <p>Load one or more translated files, then fill them in order.</p>
  </header>
  <main>
    <div id="drop" class="drop">Drop <code>first_last.txt</code> files here, or add from Downloads.</div>
    <div class="row">
      <button class="ghost" id="add">Add files</button>
      <button class="primary" id="start">Fill queue</button>
      <button class="danger" id="stop" disabled>Stop</button>
      <button class="ghost" id="clear">Clear finished</button>
    </div>
    <ul id="queue"></ul>
    <pre id="log">Ready.</pre>
  </main>
  <script>
    const $ = (id) => document.getElementById(id)
    const drop = $('drop')
    let state = { queue: [], running: false, log: 'Ready.\n' }

    function render() {
      $('start').disabled = state.running || !state.queue.some((item) => item.status === 'queued')
      $('stop').disabled = !state.running
      $('queue').innerHTML = state.queue.map((item) => `
        <li>
          <div class="name" title="${item.path || item.name}">${item.name}</div>
          <div class="status ${item.status}">${item.status}</div>
          <button class="x" data-remove="${item.id}" ${state.running ? 'disabled' : ''}>&times;</button>
        </li>
      `).join('') || '<li style="color:#6b7280">No files yet.</li>'
      const log = $('log')
      const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 24
      log.textContent = state.log || 'Ready.'
      if (atBottom) log.scrollTop = log.scrollHeight
    }

    async function refresh() {
      const res = await fetch('/api/state')
      state = await res.json()
      render()
    }

    async function post(url, body) {
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: body ? JSON.stringify(body) : '{}',
      })
      const data = await res.json().catch(() => ({}))
      if (!res.ok) throw new Error(data.error || res.statusText)
      return data
    }

    $('add').onclick = async () => {
      try {
        await post('/api/pick-files')
        await refresh()
      } catch (err) {
        if (!/cancel/i.test(String(err.message))) alert(err.message)
      }
    }
    $('start').onclick = () => post('/api/start').then(refresh).catch((err) => alert(err.message))
    $('stop').onclick = () => post('/api/stop').then(refresh).catch((err) => alert(err.message))
    $('clear').onclick = () => post('/api/clear-done').then(refresh)
    $('queue').onclick = (event) => {
      const id = event.target.dataset.remove
      if (id) post('/api/remove', { id }).then(refresh)
    }

    ;['dragenter', 'dragover'].forEach((type) => {
      drop.addEventListener(type, (event) => {
        event.preventDefault()
        drop.classList.add('over')
      })
    })
    ;['dragleave', 'drop'].forEach((type) => {
      drop.addEventListener(type, (event) => {
        event.preventDefault()
        drop.classList.remove('over')
      })
    })
    drop.addEventListener('drop', async (event) => {
      const files = [...(event.dataTransfer?.files || [])]
      if (!files.length) return
      const payload = []
      for (const file of files) {
        payload.push({ name: file.name, text: await file.text() })
      }
      await post('/api/add-uploads', { files: payload })
      await refresh()
    })

    refresh()
    setInterval(refresh, 600)
  </script>
</body>
</html>
